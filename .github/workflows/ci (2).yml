# ─────────────────────────────────────────────────────────────
# .github/workflows/ci.yml
# TechFlow Solutions — Pipeline de Integração Contínua
# Dispara em todo push/PR para main e develop
# ─────────────────────────────────────────────────────────────

name: CI — Testes Automatizados

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Job 1: testes unitários ──────────────────────────────
  testes:
    name: Pytest — Testes Unitários
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: ✅ Executar testes unitários
        run: |
          pytest tests/test_gerenciador.py -v --tb=short

      - name: 📊 Gerar relatório de cobertura
        run: |
          pytest tests/test_gerenciador.py --cov=src/gerenciador_tarefas --cov-report=term-missing

  # ── Job 2: qualidade de código ───────────────────────────
  qualidade:
    name: Flake8 — Qualidade do Código
    runs-on: ubuntu-latest
    needs: testes

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar flake8
        run: pip install flake8

      - name: 🔍 Verificar estilo do código
        run: |
          flake8 src/gerenciador_tarefas.py \
            --max-line-length=100 \
            --ignore=E501,W503 \
            --statistics
