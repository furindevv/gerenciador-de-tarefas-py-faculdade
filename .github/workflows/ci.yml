# .github/workflows/ci.yml
# Pipeline de Integração Contínua — TechFlow Solutions
# Executa os testes automatizados a cada push ou pull request.

name: CI — Testes Automatizados

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    name: Rodar testes com pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Executar testes unitários
        run: |
          pytest test_gerenciador.py -v --tb=short

      - name: Verificar qualidade do código (flake8)
        run: |
          pip install flake8
          flake8 gerenciador_tarefas.py --max-line-length=100 --ignore=E501
